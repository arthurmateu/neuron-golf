[project]
name = "neuron-golf"
version = "0.1.0"
description = "Neuron golf: change an LLM's persona by steering as few MLP neurons as possible (Qwen3.5-4B/9B, Mistral Small 4), plus a cross-model study of where those neurons live"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "flash-linear-attention>=0.6.0",
    "gguf>=0.19.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]
